name: job-bot

on:
    schedule:
        - cron: "*/15 * * * *" # every 15 min (GitHub may delay runs a few minutes)
    workflow_dispatch: # lets you run it manually from the Actions tab

permissions:
    contents: write # needed to commit seen_jobs.json back

concurrency:
    group: job-bot
    cancel-in-progress: false

jobs:
    run:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: pip

            - run: pip install -r requirements.txt

            - name: Run bot
              env:
                  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
                  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
              run: python job_bot.py

            - name: Save state
              run: |
                  git config user.name "job-bot"
                  git config user.email "job-bot@users.noreply.github.com"
                  git add seen_jobs.json
                  git diff --cached --quiet || (git commit -m "update seen jobs" && git push)
